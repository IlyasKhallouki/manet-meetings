<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Meet - Weekly product sync</title>
</head>
<body>
  <div>
    <!-- Participant tiles omitted. -->
    <div data-participant-id="spaces/abc/devices/1"></div>
    <div data-participant-id="spaces/abc/devices/2"></div>
  </div>

  <!-- Bottom-left meeting title. -->
  <div>
    <div jsname="NeC6gb" class="u6vdEc">Weekly product sync</div>
  </div>

  <!-- Call controls toolbar. -->
  <div role="region" aria-label="Call controls">
    <div>
      <button jsname="hw0c9" aria-label="Turn off microphone" data-tooltip="Turn off microphone (ctrl + d)">
        <i class="quRWN-Bz112c google-symbols notranslate" aria-hidden="true">mic</i>
      </button>
      <button jsname="psRWwc" aria-label="Turn off camera" data-tooltip="Turn off camera (ctrl + e)">
        <i class="quRWN-Bz112c google-symbols notranslate" aria-hidden="true">videocam</i>
      </button>
      <button jsname="RrG0hf" aria-label="Turn on captions" data-tooltip="Turn on captions (c)">
        <i class="quRWN-Bz112c google-symbols notranslate" aria-hidden="true" data-google-symbols-override="true">closed_caption_off</i>
      </button>
      <button aria-label="Caption settings" aria-haspopup="menu">
        <i class="quRWN-Bz112c google-symbols notranslate" aria-hidden="true">arrow_drop_up</i>
      </button>
      <button jsname="FpSaz" aria-label="Raise hand (ctrl + alt + h)">
        <i class="quRWN-Bz112c google-symbols notranslate" aria-hidden="true">back_hand</i>
      </button>
      <button jsname="NakZHc" aria-label="More options">
        <i class="quRWN-Bz112c google-symbols notranslate" aria-hidden="true">more_vert</i>
      </button>
      <button jsname="CQylAd" aria-label="Leave call" data-tooltip="Leave call">
        <i class="quRWN-Bz112c google-symbols notranslate" aria-hidden="true">call_end</i>
      </button>
    </div>
  </div>
</body>
</html>
