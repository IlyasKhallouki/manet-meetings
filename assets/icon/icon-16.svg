<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Manet Meetings toolbar icon, hand-fitted for the 1x toolbar. The caption line:
       a speaker mark above two left-aligned text bars of unequal length. Idle: white ring
       on whole pixels (x 3–9, y 2–8), its left edge on the bars' left edge. -->
  <rect x="1" y="1" width="14" height="14" rx="3.5" fill="#032A4A"/>
  <circle cx="6" cy="5" r="2.25" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="3" y="9" width="10" height="2" rx="1" fill="#FFFFFF"/>
  <rect x="3" y="12" width="6" height="2" rx="1" fill="#FFFFFF"/>
</svg>
