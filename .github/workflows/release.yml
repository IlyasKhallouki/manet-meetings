name: Release

# Pushing a version tag (v0.2.0) publishes a GitHub Release with the packed extension.
# The tag's annotation is the release notes. CI already tested the commit on main.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match package.json's version $version." >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Build and pack
        run: pnpm zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip
          --verify-tag
          --notes-from-tag
          --title "Minute Book ${GITHUB_REF_NAME#v}"
