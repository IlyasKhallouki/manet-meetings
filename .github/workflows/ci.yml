name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg (audio fixture checks)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Browser tests use the Google Chrome preinstalled on ubuntu-latest.
        # Integration tests run only when these secrets are configured; a skipped
        # integration test is reported, not counted as a pass. Secrets are scoped to this
        # step so install, build and third-party actions never see them. Notion writes
        # count against the workspace's block allowance, so they run on pushes to main only.
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NOTION_TOKEN: ${{ github.event_name == 'push' && secrets.NOTION_TOKEN || '' }}
          NOTION_TEST_DB_ID: ${{ github.event_name == 'push' && secrets.NOTION_TEST_DB_ID || '' }}
        run: pnpm test

      - name: Build and pack
        run: pnpm zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: manet-meetings-chrome
          path: .output/*-chrome.zip
          # .output starts with a dot, and the action skips hidden paths by default.
          include-hidden-files: true
          if-no-files-found: error
